name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "custom_components/mupibox/manifest.json"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.version' custom_components/mupibox/manifest.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "No valid version found in manifest.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for HACS and hassfest validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            HACS="$(gh run list --workflow hacs.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status):\(.conclusion)"' 2>/dev/null || true)"
            HASSFEST="$(gh run list --workflow hassfest.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status):\(.conclusion)"' 2>/dev/null || true)"

            echo "HACS: ${HACS:-not-started}; hassfest: ${HASSFEST:-not-started}"

            case "$HACS" in
              completed:failure|completed:cancelled|completed:timed_out|completed:action_required)
                echo "HACS validation failed: $HACS" >&2
                exit 1
                ;;
            esac
            case "$HASSFEST" in
              completed:failure|completed:cancelled|completed:timed_out|completed:action_required)
                echo "hassfest validation failed: $HASSFEST" >&2
                exit 1
                ;;
            esac

            if [ "$HACS" = "completed:success" ] && [ "$HASSFEST" = "completed:success" ]; then
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for validation workflows." >&2
          exit 1

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG"             --target "$GITHUB_SHA"             --title "MuPiBox Home Assistant $VERSION"             --generate-notes
