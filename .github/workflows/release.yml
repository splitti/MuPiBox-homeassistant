name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "custom_components/mupibox/manifest.json"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.version' custom_components/mupibox/manifest.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "No valid version found in manifest.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG"             --target "$GITHUB_SHA"             --title "MuPiBox Home Assistant $VERSION"             --notes "Initial standalone Home Assistant integration for MuPiBox.

          Highlights:
          - Local MuPiBox media player
          - Spotify Connect media player
          - Separate local and Spotify volume controls
          - Local media browser
          - TTS announcement notify entity
          - Battery, Wi-Fi and connectivity sensors
          - Diagnostic entities
          - Library rescan, UI restart, reboot and power-off controls
          - Display screenshot camera
          - Config flow with optional MuPiBox Admin authentication
          - HACS and Hassfest validation"
